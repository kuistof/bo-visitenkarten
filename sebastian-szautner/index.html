<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sebastian Szautner – Bo.rentals</title>
  <style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bo:#E8706A;--black:#090909;--white:#ffffff;--dim:rgba(255,255,255,0.45);--card:rgba(255,255,255,0.04);--line:rgba(255,255,255,0.08);--font:'Helvetica Neue',Helvetica,Arial,sans-serif}
    html,body{height:100%;background:var(--black);color:var(--white);font-family:var(--font);-webkit-font-smoothing:antialiased}
    .logo{position:fixed;top:28px;left:36px;font-size:22px;font-weight:900;letter-spacing:-0.5px;color:var(--bo);text-decoration:none;z-index:10;user-select:none}
    .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:180px 24px 60px}
    .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:40px 36px 36px;display:flex;flex-direction:column;align-items:center;text-align:center}
    .photo{width:96px;height:96px;border-radius:50%;overflow:hidden;flex-shrink:0;margin-bottom:24px;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center}
    .photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
    .initials{font-size:32px;font-weight:900;color:var(--bo);letter-spacing:-1px}
    .role{display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--bo);border:1px solid rgba(232,112,106,0.35);border-radius:100px;padding:5px 14px;margin-bottom:14px}
    .name{font-size:30px;font-weight:900;letter-spacing:-0.8px;line-height:1.05;margin-bottom:6px}
    .company{font-size:13px;color:var(--dim);margin-bottom:28px;font-weight:500;line-height:1.4}
    .divider{width:100%;height:1px;background:var(--line);margin-bottom:24px}
    .contacts{width:100%;display:flex;flex-direction:column;gap:14px;margin-bottom:28px;text-align:left}
    .contact-row{display:flex;align-items:center;gap:12px}
    .contact-icon{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .contact-icon svg{opacity:0.55}
    .contact-text{display:flex;flex-direction:column;gap:1px;min-width:0}
    .contact-label{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim)}
    .contact-value{font-size:14px;font-weight:500;color:var(--white);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .contact-value:hover{color:var(--bo)}
    .btn{width:100%;background:var(--bo);color:var(--white);font-family:var(--font);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;border:none;border-radius:10px;padding:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s,transform .1s}
    .btn:hover{opacity:.88}.btn:active{transform:scale(.98)}
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(60px);background:#1a1a1a;color:var(--white);font-size:13px;font-weight:600;padding:12px 24px;border-radius:100px;border:1px solid var(--line);opacity:0;transition:transform .3s ease,opacity .3s ease;white-space:nowrap;z-index:999;pointer-events:none}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:480px){.logo{top:16px;left:16px}.card{padding:32px 24px 28px;border-radius:14px}.name{font-size:26px}}.page{padding-top:180px}</style>
</head>
